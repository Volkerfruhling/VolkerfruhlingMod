l_japanese:
 ### ドイツ帝国の国民精神（common/ideas/_vf_ideas_GER.txt） ###
 idea_GER_power_balance: "勢力均衡"
 idea_GER_power_balance_desc: "帝国は皇帝、摂政、議会の均衡の上に成り立っている。§Y皇帝派§!: [?vf_GER_bop_kaiser|0]（[?vf_GER_bop_kaiser_share|0]%%）／§Y摂政派§!: [?vf_GER_bop_regent|0]（[?vf_GER_bop_regent_share|0]%%）／§Y議会派§!: [?vf_GER_bop_assembly|0]（[?vf_GER_bop_assembly_share|0]%%）
枢密院の傾き: [GER.VfGerPrivyTilt]"

 idea_GER_liberal_cabinet: "自由主義の内閣"
 idea_GER_liberal_cabinet_desc: "プリンツ・マックスの内閣は続投を果たした。だがこの信任は無期限ではない。"
 idea_GER_path_to_liberalism: "自由主義への道"
 idea_GER_path_to_liberalism_desc: "対立ではなく対話を、独裁ではなく理性を。帝国は自由の原則へと歩み出した。"
 idea_GER_strengthened_cabinet: "強化された内閣"
 idea_GER_strengthened_cabinet_desc: "行政権は内閣に集約された。宰相の署名が、勅命よりも重い時代が始まる。"
 idea_GER_parliamentary_sovereignty: "議会主権"
 idea_GER_parliamentary_sovereignty_desc: "議会の議決こそが帝国の法である。"
 idea_GER_1928_reforms: "1928年改革"
 idea_GER_1928_reforms_desc: "個別の改革は統合され、国家の新たな形が内外に宣言された。"
 idea_GER_1929_constitution: "1929年憲法"
 idea_GER_1929_constitution_desc: "1848年の理想、ビスマルクの現実主義、そして改革の成果。その全てを盛り込んだ新たな基本法の下、ドイツは生まれ変わった。"

 idea_GER_cultural_tolerance: "文化的寛容"
 idea_GER_cultural_tolerance_desc: "抑圧ではなく寛容こそが、帝国を内側から強くする唯一の道だ。"
 idea_GER_age_of_progress: "進歩の時代"
 idea_GER_age_of_progress_desc: "進歩こそが我々の旗印だ。"
 idea_GER_unemployment_insurance: "失業保険制度"
 idea_GER_unemployment_insurance_desc: "国家は、失業者が再び立ち上がるまでの生活を保障する。"
 idea_GER_social_state: "社会国家ドイツ"
 idea_GER_social_state_desc: "全ての国民に、適切な住居と公共サービスへのアクセスを。"
 idea_GER_national_service: "国家奉仕"
 idea_GER_national_service_desc: "国家への奉仕を通じて、若者は社会の一員としての自覚と誇りを育む。"
 idea_GER_new_era_diplomacy: "新時代の外交"
 idea_GER_new_era_diplomacy_desc: "「伯爵」に率いられた外交官たちが、国益のために世界を駆け巡る。"

 idea_GER_unresolved_legacy: "未解決の遺産"
 idea_GER_unresolved_legacy_desc: "帝冠領の曖昧な地位は、あらゆる国政の議題に影を落とし続けている。"
 idea_GER_absent_privy_council: "枢密院の不在"
 idea_GER_absent_privy_council_desc: "影の調停者は消えた。皇帝と摂政の間に立つ者は、もはや憲法しかない。だがその憲法は、まだ書かれていない。"

 idea_GER_hope_for_social_reform: "社会改革への期待"
 idea_GER_hope_for_social_reform_desc: "漸進的な改革への期待が、労働者街に満ちている。"
 idea_GER_thirst_for_revolution: "革命への渇望"
 idea_GER_thirst_for_revolution_desc: "議場の喧騒の奥で、真の変革を求める声が熱を帯びている。"
 idea_GER_privy_council_kaiser: "皇帝の枢密院"
 idea_GER_privy_council_kaiser_desc: "枢密院はベルリンの意を汲んで動く。"
 idea_GER_privy_council_regent: "摂政の枢密院"
 idea_GER_privy_council_regent_desc: "枢密院はウィーンの意を汲んで動く。"
 idea_GER_adriatic_guardian: "アドリア海の守護者"
 idea_GER_adriatic_guardian_desc: "イストリアは帝国の盾である。"
 idea_GER_balkan_withdrawal: "バルカンからの撤退"
 idea_GER_balkan_withdrawal_desc: "火薬庫から手を引いた分だけ、家計は楽になった。"
 idea_GER_parliament_led_government: "議会主導政府"
 idea_GER_parliament_led_government_desc: "帝国の舵は、パウロ教会の議場に委ねられた。"

 idea_GER_mitteleuropa: "中欧経済圏"
 idea_GER_mitteleuropa_desc: "フランクフルトを中心とする経済圏が、中欧の市場を束ねる。"
 idea_GER_autarky: "経済的自立"
 idea_GER_autarky_desc: "帝国は自らの資源で立つ。"
 idea_GER_burgfrieden: "城内平和"
 idea_GER_burgfrieden_desc: "党派の対立は国境の前で停止する。"
 idea_GER_road_to_silent_dictatorship: "沈黙の独裁への道"
 idea_GER_road_to_silent_dictatorship_desc: "最高軍司令部が経済の実権を握った。議会は沈黙している。"
 idea_GER_parliaments_war: "議会の戦争"
 idea_GER_parliaments_war_desc: "この戦争は議会の戦争である。予算も、動員も、講和も、議場で決まる。"
 idea_GER_total_war_system: "総力戦体制の完成"
 idea_GER_total_war_system_desc: "帝国の全てが、勝利のために組織された。"

 ### 枢密院の傾き（scripted_localisation） ###
 vf_GER_privy_tilt_neutral: "中立"
 vf_GER_privy_tilt_kaiser: "皇帝"
 vf_GER_privy_tilt_regent: "摂政"
 vf_GER_privy_tilt_abolished: "廃止"

 idea_GER_health_insurance: "健康保険制度"
 idea_GER_health_insurance_desc: "病から国民を守るのは国家の責務である。"
 idea_GER_accident_insurance: "労災保険制度"
 idea_GER_accident_insurance_desc: "職場の危険から労働者を守るのは国家の責務である。"
 idea_GER_old_age_pension: "老齢年金制度"
 idea_GER_old_age_pension_desc: "老いから国民を守るのは国家の責務である。"

 idea_GER_rationalization: "合理化運動"
 idea_GER_rationalization_desc: "テイラー主義の波がドイツの工場に届いた。無駄は罪である。"

 idea_GER_schlieffen_plan: "改良シュリーフェン・プラン"
 idea_GER_schlieffen_plan_desc: "老元帥の遺した計画は、自動車と鉄道の時代に合わせて磨き直された。"
 idea_GER_forward: "前進！"
 idea_GER_forward_desc: "攻撃精神こそが勝利の母である。"
 idea_GER_supply_reform: "兵站改革"
 idea_GER_supply_reform_desc: "戦争は兵站で決まる。グレーナーの弟子たちはそう教わった。"
 idea_GER_ostwall: "オストヴァル"
 idea_GER_ostwall_desc: "東の国境に、コンクリートの防壁が築かれつつある。"
 idea_GER_wall_system: "東西の防壁"
 idea_GER_wall_system_desc: "オストヴァルとヴェストヴァル。帝国は東西を石で固めた。"
 idea_GER_absolute_defence: "絶対的防御"
 idea_GER_absolute_defence_desc: "一歩も通さぬ。それが国土防衛計画の結論である。"
