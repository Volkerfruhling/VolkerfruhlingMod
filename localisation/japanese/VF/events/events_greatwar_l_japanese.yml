 ### クロアチア危機〜世界大戦の発火連鎖（events/_vf_events_greatwar.txt） ###
 # 口実は国境衝突型（主宰裁定 2026-08-26。指示書 §10-4）

 vf_greatwar.1.title: "スレム国境の銃撃戦"
 vf_greatwar.1.desc: "1929年夏、サヴァ川沿いの国境地帯で、セルビア義勇兵の一団とクロアチア国境警備隊が衝突した。双方の応射は夜を徹して続き、夜明けまでに両岸で数十名の死者が出た。ザグレブは「計画的な武力侵犯」と断じ、ベオグラードは「同胞保護のための自衛」と応じた。欧州の各国首脳は、15年前に凍りついたはずの戦争の足音を聞いている。"
 vf_greatwar.1.a: "もう引き返せない"

 vf_greatwar.2.title: "帝国の対応"
 vf_greatwar.2.desc: "スレム国境の銃撃戦の報がフランクフルトに届いた。帝冠領クロアチアへの攻撃は帝国への攻撃である。摂政府と参謀本部は、ベオグラードへの対応を協議している。"
 vf_greatwar.2.a: "最後通牒を突きつけろ"
 vf_greatwar.2.b: "仲裁を試みる"
 vf_greatwar.2.c: "静観する"

 vf_greatwar.3.title: "露仏の保障確認"
 vf_greatwar.3.desc: "ベオグラードの照会に対し、ペテルブルクは即座に回答した——「ロシアはセルビアを見捨てない」。パリからも同様の言質が届いている。後ろ盾は固い。"
 vf_greatwar.3.desc_no_patron: "ベオグラードの照会に対し、ペテルブルクの回答は歯切れが悪かった。軍事使節も受け入れていない我々に、ロシアはどこまで付き合うつもりなのか。それでも、もう賽は投げられている。"
 vf_greatwar.3.a: "決行あるのみ"

 vf_greatwar.4.title: "フランクフルトからの最後通牒"
 vf_greatwar.4.desc: "ドイツ帝国政府は48時間の期限付き最後通牒を突きつけた——国境地帯の非武装化、扇動放送の停止、帝国監察官の受け入れ。受諾は屈服を、拒否は戦争を意味する。"
 vf_greatwar.4.a: "拒否する。セルビアは屈しない"
 vf_greatwar.4.b: "受諾する（危機は延期される）"

 vf_greatwar.5.title: "動員の連鎖"
 vf_greatwar.5.desc: "最後通牒の期限が切れた。セルビアが動員を下令し、ドイツが応じ、ロシアが国境へ軍を寄せ、フランスが予備役を召集する。1929年の夏、欧州の鉄道はすべて軍用列車のために空けられた。"
 vf_greatwar.5.a: "時刻表は止められない"

 vf_greatwar.6.title: "世界大戦の勃発"
 vf_greatwar.6.desc: "1929年秋、セルビア軍はサヴァ川を渡った。帝冠領クロアチアへの侵攻は、その宗主たるドイツ帝国との戦争であり、英独同盟の参戦であり、そして露仏のセルビア側参戦である。凍りついた平和は、ついに砕け散った。"
 vf_greatwar.6.a: "諸国民の春は、鉄と血で贖われる"

 vf_greatwar.7.title: "ベオグラードからの要求"
 vf_greatwar.7.desc: "セルビア政府は、帝冠領クロアチアの一部——スレムとマチュヴァ——の返還を公式に要求してきた。帝国の一体性への公然たる挑戦である。"
 vf_greatwar.7.a: "身の程を知らぬ小国め"

 vf_greatwar.8.title: "ベオグラードからの要求"
 vf_greatwar.8.desc: "セルビア政府がスレム西部の返還を公式に要求した。国内のセルビア人地区では、夜ごと集会が開かれているという。ザグレブの空気は日に日に重くなる。"
 vf_greatwar.8.a: "ベルリンは我々を守るはずだ"

 vf_greatwar.9.title: "バルカンの黒雲"
 vf_greatwar.9.desc: "セルビアとドイツ帝国の対立は、もはや外交の段階を越えつつある。各国の参謀本部は、動員計画の埃を払い始めた。"
 vf_greatwar.9.a: "嵐が来る"

 vf_greatwar.10.title: "大戦への去就"
 vf_greatwar.10.desc: "欧州が二つの陣営に割れて燃え上がる中、我が国もまた去就の決断を迫られている。参戦か、中立か——いずれの道にも代償がある。"
 vf_greatwar.10.a: "政府の決定に従う"

 vf_greatwar.20.title: "大戦の終結——ベオグラードの凱歌"
 vf_greatwar.20.desc: "ドイツ帝国は降伏した。スレムとマチュヴァは再びセルビアの手に戻り、1915年の屈辱は完全に贖われた。復讐は成し遂げられたのだ。"
 vf_greatwar.20.a: "大セルビアの夜明け"

 vf_greatwar.21.title: "大戦の終結——二度目の敗北"
 vf_greatwar.21.desc: "ベオグラードは再び陥落した。二度目の敗北は、一度目よりも重い代償を国民に強いるだろう。"
 vf_greatwar.21.a: "……"

