 ### ドイツ帝国：幹線イベント（events/_vf_events_GER.txt） ###
 # desc は GER_04_lore.xlsx Sheet2 の原文（指示書 §15-2）

 event_GER_pol.1.title: "皇帝、摂政、議会"
 event_GER_pol.1.desc: "我らがドイツ帝国は、皇帝、摂政、そして国民議会の三者が複雑に絡み合うことで成り立っている。この奇跡的ともいえる均衡は、帝国の安定の礎であると同時に、常に崩壊の危険をはらんでいる。今後、我々の下す決断が、この天秤をどちらに傾けることになるだろうか。"
 event_GER_pol.1.a: "理解した。"

 event_GER_pol.2.title: "自由主義の宰相"
 event_GER_pol.2.desc: "宰相の座にあるマクシミリアン・フォン・バーデンは、その穏健な自由主義によって帝国の舵取りを行ってきた。議会は彼の続投を望んでいるが、宮廷では新たな指導者を求める声も囁かれている。彼の任期が終わりに近づく今、我々は帝国の指導者について決断を下さねばならない。"
 event_GER_pol.2.a: "議会を尊重しよう！"
 event_GER_pol.2.b: "そろそろ潮時だな"

 event_GER_pol.3.title: "SPDの躍進"
 event_GER_pol.3.desc: "フランクフルトの国民議会では、社会民主党（SPD）が労働者の支持を背景に躍進を続けている。彼らの掲げる漸進的な改革は、帝国に新たな活力をもたらす時代の必然か。それとも、革命の理想を議会政治の安逸に売り渡した、裏切り者の姿か。"
 event_GER_pol.3.a: "漸進前進！"
 event_GER_pol.3.b: "マルクスの意思はどうした？"

 event_GER_pol.4.title: "曖昧な帝冠"
 event_GER_pol.4.desc: "帝国の心臓部に横たわるハプスブルクの領域、オーストリア帝冠領。それは国家内国家であり、帝国の統一を阻む最大の障害か、あるいは多様性の証か。我々はこの曖昧な存在の未来を、明確に定義しなくてはならない。"
 event_GER_pol.4.a: "触れないでおこう"
 event_GER_pol.4.b: "旧国家の残骸だ"
 event_GER_pol.4.c: "偉大なるウィーンの帝冠"
 event_GER_pol.4.d: "改革が必要だな"

 event_GER_pol.5.title: "双頭の脳髄"
 event_GER_pol.5.desc: "皇帝と摂政の衝突を避けるべくビスマルクが創設した枢密院。法に定められぬこの影の機関は、今やその役割を見失いつつある。我々はこの機関を誰のために、そして何のために利用するのか。あるいは、その存在そのものに終止符を打つべきなのか。"
 event_GER_pol.5.a: "中立を維持する"
 event_GER_pol.5.b: "皇帝を優先すべきだ"
 event_GER_pol.5.c: "摂政を優先すべきだ"
 event_GER_pol.5.d: "憲法外機関は廃止しよう"

 event_GER_pol.6.title: "奇妙な領域"
 event_GER_pol.6.desc: "アドリア海に突き出すイストリア半島。ビスマルク外交の遺産として、イタリアとの共同管理下に置かれているこの地を巡り、様々な思惑が交錯する。我々は、この奇妙な領域の運命を決定しなければならない。"
 event_GER_pol.6.a: "干渉地帯は必要だ"
 event_GER_pol.6.b: "イタリアにくれてやって良い"
 event_GER_pol.6.c: "絶対に保持しなければ"
 event_GER_pol.6.d: "交渉次第だろう"

 event_GER_pol.7.title: "パイと火薬庫"
 event_GER_pol.7.desc: "我々の支援の下に結成されたバルカン同盟は、地域の安定の楔であると同時に、我々を厄介な紛争へと引きずり込む危険な鎖でもある。我々は火薬庫から距離を置くのか、それとも自ら火中の栗を拾いに行くのか。"
 event_GER_pol.7.a: "何故火遊びをしなければならないのだ？"
 event_GER_pol.7.b: "抑えておこう"
 event_GER_pol.7.c: "王冠をこの手に！"
 event_GER_pol.7.d: "優位性を保たねば"

 event_GER_pol.8.title: "枢密院会議"
 event_GER_pol.8.desc: "これまでの選択が帝国の未来を形作ってきた。皇帝、摂政、議会の間に生まれた緊張は、もはや無視できないレベルに達している。枢密院での会議は紛糾し、内閣は機能不全に陥った。帝国は分裂の危機に瀕している。この嵐を乗り切ることはできるのか、それとも…。"
 event_GER_pol.8.a: "もう少し見てみよう"
 event_GER_pol.8.b: "もう無理だ"

 event_GER_pol.9.title: "帝国の岐路"
 event_GER_pol.9.desc: "枢密院での議論は、帝国の権力構造がもはや維持できないことを明らかにした。内閣は崩壊し、新たな指導体制を構築する必要がある。これまでの選択は、各勢力の影響力を大きく変えた。今こそ決断の時である。議会に民意を問うのか、あるいは君主の権威の下に帝国を再統一するのか。帝国の運命は、我々の選択にかかっている。（君主派・内戦の道は今後のアップデートで解放されます）"
 event_GER_pol.9.a: "議会に未来を託す"
 event_GER_pol.9.b: "君主こそが国家の礎だ"
 event_GER_pol.9.c: "だれ一人として譲らなかった"

 event_GER_pol.10.title: "中断された改革"
 event_GER_pol.10.desc: "世界大戦の勃発は、憲法改正への歩みを断ち切った。議事堂の時計は戦争の終わりまで止まる。だが、積み上げてきた改革が消えるわけではない。銃声が止んだその日、我々は再びこの議場に戻ってくるだろう。"
 event_GER_pol.10.a: "銃声の前に、議事は止まる"

 event_GER_pol.11.title: "対立の凍結"
 event_GER_pol.11.desc: "皇帝派も、摂政派も、議会派も、決着をつける前に戦争が来てしまった。外敵を前にして、帝国の内輪もめは凍結される。この対立の決着は、戦争の後に持ち越されるのだ。" # TODO(VF): Phase 3 で文面を推敲
 event_GER_pol.11.a: "内輪もめは終わりだ"

 ### 選挙3連イベント（§8-1） ###
 event_GER_pol.12.title: "選挙戦の季節"
 event_GER_pol.12.desc: "1926年議会選挙の火蓋が切られた。壁という壁にポスターが貼られ、ビアホールは演説会場と化す。ヴァイマル連合はいかにしてこの審判を戦うのか。"
 event_GER_pol.12.a: "実績を訴える"
 event_GER_pol.12.b: "組織を動員する"
 event_GER_pol.12.c: "敵失を待つ"

 event_GER_pol.13.title: "1926年 国民議会選挙"
 event_GER_pol.13.desc: "開票の夜、パウロ教会前の広場は人で埋まった。ヴァイマル連合の勝利は確実となったが、連合内のどの勢力が新政権の重心となるかは、最後の議席まで決まらなかった。"
 event_GER_pol.13.a: "労働者の連合（社会民主党を軸に）"
 event_GER_pol.13.b: "南部との融和（中央党を軸に）"
 event_GER_pol.13.c: "産業界との同盟（自由主義者を軸に）"

 event_GER_pol.14.title: "新内閣の顔ぶれ"
 event_GER_pol.14.desc_spd: "労働者の信望を集める社会民主党の指導者が、新内閣を率いることになった。工場街は祝杯を挙げ、宮廷は眉をひそめている。"
 event_GER_pol.14.desc_zentrum: "南部の融和者として知られる中央党の重鎮が、新内閣を率いることになった。カトリック諸邦は安堵し、連合の均衡は保たれた。"
 event_GER_pol.14.desc_liberal: "産業界の代弁者たる自由主義者が、新内閣を率いることになった。取引所は沸き、労組は警戒している。"
 event_GER_pol.14.a: "新内閣に幸あれ"

 ### 合間イベント（§8-2） ###
 event_GER_pol.15.title: "ユンカーの抵抗"
 event_GER_pol.15.desc: "東部の大地主たちが、改革への公然たる抵抗を開始した。彼らの影響力は宮廷と軍の深部にまで及んでいる。"
 event_GER_pol.15.a: "妥協点を探る"
 event_GER_pol.15.b: "押し切る"

 event_GER_pol.16.title: "諸邦の反応"
 event_GER_pol.16.desc: "帝冠領の再編に対し、諸邦の宮廷から様々な反応が届いている。プラハは新たな地位を歓迎し、ウィーンは沈黙し、ザグレブは条件を数え上げている。"
 event_GER_pol.16.a: "諸邦に配慮しつつ進める"

 event_GER_pol.17.title: "ルールの労働争議"
 event_GER_pol.17.desc: "ルール工業地帯で大規模なストライキが発生した。賃上げと労働時間短縮を求める労働者たちに対し、経営者側は一歩も引かない構えである。"
 event_GER_pol.17.a: "労働者と交渉する"
 event_GER_pol.17.b: "憲兵隊を送る"

 event_GER_pol.18.title: "憲法審議の攻防"
 event_GER_pol.18.desc: "憲法改正案の審議が大詰めを迎えている。保守派は修正案を積み上げて時間を稼ぎ、急進派は原案の即時採決を叫ぶ。議長の木槌は鳴りやまない。"
 event_GER_pol.18.a: "宥和（修正案を受け入れる）"
 event_GER_pol.18.b: "強行（原案のまま押し切る）"

 event_GER_pol.19.title: "バルカンの砲声"
 event_GER_pol.19.desc: "セルビアがバルカン同盟諸国へ宣戦した。半島は再び戦火に包まれている。フランクフルトの新聞は号外を刷り、参謀本部の灯りは夜通し消えない。"
 event_GER_pol.19.a: "半島の嵐を注視せよ"

 event_GER_pol.20.title: "ベオグラードの講和"
 event_GER_pol.20.desc: "バルカン戦争が終わった。だが外務省の報告は楽観を許さない——勝利したセルビアに、ペテルブルクとパリが急速に接近しているというのだ。バルカンの火薬庫には、より太い導火線が繋がれつつある。"
 event_GER_pol.20.a: "次の嵐は近い"

 event_GER_pol.21.title: "嵐の予感"
 event_GER_pol.21.desc: "バルカンの戦火は、帝国軍部の空気を一変させた。参謀本部は動員計画の見直しに着手し、これまで棚上げされてきた軍備の刷新が、初めて現実の政治日程に載った。"
 event_GER_pol.21.a: "備えねばならない"

 event_GER_pol.22.title: "進歩の光と影"
 event_GER_pol.22.desc: "新しい集合住宅に電灯が点り、路面電車が郊外まで延びた。だが古い街区の住人たちは、変わりゆく街並みに一抹の寂しさを覚えてもいる。"
 event_GER_pol.22.a: "それでも時代は進む"

 event_GER_pol.23.title: "ローマとの対話"
 event_GER_pol.23.desc: "イストリアの未来を巡る交渉のため、特使がローマへ発った。ビスマルクの遺産たる共同管理区域の扱いは、イタリアとの関係そのものを映す鏡である。"
 event_GER_pol.23.a: "イタリアへの完全譲渡"
 event_GER_pol.23.b: "非武装中立地帯化"
 event_GER_pol.23.c: "現状維持の再確認"
